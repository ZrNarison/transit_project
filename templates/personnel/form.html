{% extends "base.html" %}


{% block content %}

<div class="container mt-4">


<h3>
{% if form.instance.pk %}
Modifier personnel
{% else %}
Ajouter personnel
{% endif %}
</h3>


<form method="POST"
      enctype="multipart/form-data">


{% csrf_token %}


{% for field in form %}

<div class="mb-3">

<label class="form-label">
{{ field.label }}
</label>


{{ field }}


{% if field.errors %}

<div class="text-danger">

{{ field.errors }}

</div>

{% endif %}


</div>


{% endfor %}



<button class="btn btn-success">
Enregistrer
</button>


<a href="{% url 'personnel:personnel_list' %}"
   class="btn btn-secondary">
Annuler
</a>


</form>


</div>


{% endblock %}
