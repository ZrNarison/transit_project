{% extends "base.html" %}

{% block title %}Confirmation suppression{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4 text-center">

        <h4 class="text-danger mb-3">
            Confirmer la suppression
        </h4>

        <p>
            Voulez-vous vraiment supprimer cette entrée de matériel ?
        </p>

        <p>
            <strong>{{ entree.id_Materiel.nom }}</strong>
            - {{ entree.Nb_Entre }}
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Oui supprimer
            </button>

            <a href="{% url 'materielEntre:materielEntre_list' %}"
               class="btn btn-secondary">
                Annuler
            </a>
        </form>

    </div>

</div>

{% endblock %}
