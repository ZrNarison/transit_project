{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">
                {{ titre }}
            </h4>
        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                {{ form.non_field_errors }}

                {% for field in form %}

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            {{ field.label }}
                        </label>

                        {{ field }}

                        {% if field.errors %}
                            <div class="text-danger small">
                                {{ field.errors }}
                            </div>
                        {% endif %}

                    </div>

                {% endfor %}

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="fas fa-save me-1"></i>
                        Enregistrer

                    </button>

                    <a
                        href="{% url 'materiaux:entrees_list' %}"
                        class="btn btn-secondary">

                        Annuler

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
