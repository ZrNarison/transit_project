{% extends "base.html" %}


{% block title %}
Changer mot de passe
{% endblock %}


{% block content %}


<div class="card shadow-sm p-4">

users_list
<h3 class="text-primary text-center">
Changer mot de passe
</h3>



<form method="post">

{% csrf_token %}



<div class="mb-3">

<label>
Nouveau mot de passe
</label>

<input type="password"
       name="password"
       class="form-control">

</div>



<div class="mb-3">

<label>
Confirmation
</label>

<input type="password"
       name="confirmation"
       class="form-control">

</div>



<button class="btn btn-success">
Modifier
</button>


<a href="{% url 'users:users_detail' user.id %}"
class="btn btn-secondary">
Retour
</a>



</form>


</div>


{% endblock %}
