{% extends "base.html" %}


{% block title %}
Changer utilisateur
{% endblock %}


{% block content %}


<div class="card shadow-sm p-4">


<h3 class="text-primary text-center">
Modifier nom utilisateur
</h3>


<form method="post">

{% csrf_token %}


<div class="mb-3">

<label>
Nom utilisateur
</label>


<input type="text"
       name="username"
       value="{{ user.username }}"
       class="form-control">


</div>



<button class="btn btn-success">
Modifier
</button>


<a href="{% url 'users:users_detail' user.id %}"
class="btn btn-secondary">
Retour
</a>


</form>


</div>


{% endblock %}
