{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h3>Changer la photo</h3>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Nouvelle photo
            </label>

            <input type="file"
                   name="photo"
                   class="form-control"
                   accept="image/*"
                   required>

        </div>


        <button type="submit"
                class="btn btn-primary">
            Enregistrer
        </button>

    </form>

</div>

{% endblock %}
