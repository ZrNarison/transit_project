{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h3 class="text-center text-uppercase mb-4">
                <span class="text-primary mb-auto">
                    Connexion
                </span>
            </h3>


            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-danger">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}



            <form method="post">

                {% csrf_token %}


                <div class="mb-3">

                    <label>
                        Nom utilisateur
                    </label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Votre utilisateur"
                           required>

                </div>



                <div class="mb-3">

                    <label>
                        Mot de passe
                    </label>

                    <div class="input-group">
                        <input type="password"
                               id="login-password"
                               name="password"
                               class="form-control"
                               placeholder="Votre mot de passe"
                               required>
                        <button class="btn btn-outline-secondary"
                                type="button"
                                id="toggle-password-visibility"
                                title="Afficher / masquer le mot de passe">
                            👁
                        </button>
                    </div>

                </div>



                <hr>



                <button type="submit"
                        class="btn btn-primary w-100">

                    Se connecter

                </button>



            </form>


        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const toggleButton = document.getElementById('toggle-password-visibility');
        const passwordInput = document.getElementById('login-password');

        if (toggleButton && passwordInput) {
            toggleButton.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleButton.textContent = type === 'password' ? '👁' : '🙈';
            });
        }
    });
</script>

{% endblock %}
