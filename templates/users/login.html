{% extends "base.html" %}

{% block title %}Connexion - Transit ERP{% endblock %}

{% block content %}

<div class="container">
    <div class="row justify-content-center mt-5 mb-5">
        <div class="col-md-5 col-lg-4">

            <div class="card shadow-sm border-0 p-4">

                <!-- EN-TÊTE -->
                <h3 class="text-center text-uppercase mb-2">
                    <span class="text-primary">
                        <i class="fas fa-sign-in-alt me-2"></i>
                        Connexion
                    </span>
                </h3>

                <p class="text-center text-muted mb-4">
                    Transit ERP
                </p>

                <!-- MESSAGES -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- FORMULAIRE DE CONNEXION -->
                <form method="post" action="{% url 'users:login' %}">
                    {% csrf_token %}

                    <!-- CHOIX DE L'ENTREPRISE -->
                    <div class="mb-3">
                        <label for="entreprise" class="form-label">Entreprise</label>

                        <select name="entreprise" id="entreprise" class="form-select" required>
                            <option value="entreprise"
                                {% if request.POST.entreprise != "H" %}selected{% endif %}>
                                E- Long
                            </option>
                            <option value="entreprise"
                                {% if request.POST.entreprise != "H" %}selected{% endif %}>
                                Galaxy
                            </option>

                            <option value="H"
                                {% if request.POST.entreprise == "H" %}selected{% endif %}>
                                M.C.C.R
                            </option>
                        </select>
                    </div>

                    <!-- NOM D'UTILISATEUR -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Nom d'utilisateur
                        </label>

                        <input
                            type="text"
                            name="username"
                            id="username"
                            class="form-control"
                            placeholder="Votre nom d'utilisateur"
                            autocomplete="username"
                            value="{{ request.POST.username|default:'' }}"
                            required
                            autofocus
                        >
                    </div>

                    <!-- MOT DE PASSE -->
                    <div class="mb-3">
                        <label for="login-password" class="form-label">
                            Mot de passe
                        </label>

                        <div class="input-group">
                            <input
                                type="password"
                                id="login-password"
                                name="password"
                                class="form-control"
                                placeholder="Votre mot de passe"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                id="toggle-password-visibility"
                                title="Afficher ou masquer le mot de passe"
                                aria-label="Afficher le mot de passe"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <hr>

                    <!-- BOUTON DE CONNEXION -->
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>
                        Se connecter
                    </button>

                </form>

            </div>

            <p class="text-center text-muted small mt-3">
                Accès réservé aux utilisateurs autorisés.
            </p>

        </div>
    </div>
</div>

<!-- AFFICHER / MASQUER LE MOT DE PASSE -->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggleButton = document.getElementById(
        "toggle-password-visibility"
    );

    const passwordInput = document.getElementById(
        "login-password"
    );

    if (toggleButton && passwordInput) {
        toggleButton.addEventListener("click", function () {
            const visible = passwordInput.type === "password";

            passwordInput.type = visible ? "text" : "password";

            toggleButton.innerHTML = visible
                ? '<i class="fas fa-eye-slash"></i>'
                : '<i class="fas fa-eye"></i>';

            toggleButton.setAttribute(
                "aria-label",
                visible
                    ? "Masquer le mot de passe"
                    : "Afficher le mot de passe"
            );

            toggleButton.title = visible
                ? "Masquer le mot de passe"
                : "Afficher le mot de passe";
        });
    }
});
</script>

{% endblock %}
