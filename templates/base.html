{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#212529">
    <meta name="description" content="Transit ERP - Gestion des projets, matériaux, personnel et opérations">

    <title>{% block title %}Transit ERP{% endblock %}</title>

    <!-- CSS locaux : fonctionnement hors ligne -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        /* ==========================================
           BASE GÉNÉRALE
           ========================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow-wrap: break-word;
        }

        img,
        video,
        iframe {
            max-width: 100%;
        }

        img {
            height: auto;
        }

        button,
        input,
        select,
        textarea {
            max-width: 100%;
        }

        .navbar.sticky-top {
            position: sticky;
            top: 0;
            z-index: 1030;
            width: 100%;
            max-width: 100%;
            align-self: flex-start;
        }

        /* Conserver le comportement normal des autres navbars */
        .navbar:not(.sticky-top) {
            position: relative;
            z-index: 1030;
            width: 100%;
            max-width: 100%;
        }

        .navbar .container-fluid {
            min-width: 0;
        }


        .navbar .container-fluid {
            min-width: 0;
        }

        .navbar .navbar-brand {
            flex-shrink: 0;
            white-space: nowrap;
        }

        .navbar .navbar-brand img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .navbar .navbar-collapse,
        .navbar .navbar-nav {
            min-width: 0;
        }

        .navbar .navbar-toggler {
            flex-shrink: 0;
            margin-left: auto;
        }

        /* ==========================================
           MENUS DÉROULANTS
           ========================================== */

        /*
         * Ne pas appliquer min-width: 0 aux dropdown-menu.
         * Cela peut rendre les menus beaucoup trop étroits.
         */

        .navbar .dropdown {
            position: relative;
        }

        .navbar .dropdown-menu {
            width: max-content;
            min-width: 220px;
            max-width: min(360px, 92vw);
            box-sizing: border-box;
            z-index: 1050;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .navbar .dropdown-menu .dropdown-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 7px 14px;
            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
        }

        .navbar .dropdown-menu .dropdown-item i,
        .navbar .dropdown-menu .dropdown-item .fa,
        .navbar .dropdown-menu .dropdown-item .fas,
        .navbar .dropdown-menu .dropdown-item svg {
            flex-shrink: 0;
        }

        .navbar .dropdown-menu .dropdown-item-text {
            white-space: normal;
            overflow-wrap: anywhere;
        }

        /* ==========================================
           CONTENU PRINCIPAL
           ========================================== */

        .main-content {
            flex: 1 0 auto;
            width: 100%;
            min-width: 0;
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
        }

        .main-content > * {
            max-width: 100%;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        td,
        th,
        label {
            overflow-wrap: anywhere;
        }

        /* ==========================================
           TABLEAUX
           ========================================== */

        .table-responsive {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table-responsive table {
            margin-bottom: 0;
        }

        /* ==========================================
           FORMULAIRES
           ========================================== */

        input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]),
        select,
        textarea {
            max-width: 100%;
        }

        textarea {
            resize: vertical;
        }

        .form-control,
        .form-select {
            width: 100%;
            min-width: 0;
        }

        /* ==========================================
           BOUTONS
           ========================================== */

        .btn {
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .btn-group {
            max-width: 100%;
            flex-wrap: wrap;
        }

        /* ==========================================
           CARTES ET MODALES
           Ne pas contraindre les menus déroulants ici
           ========================================== */

        .card,
        .modal-content {
            max-width: 100%;
            min-width: 0;
        }

        /* ==========================================
           NOTIFICATIONS DJANGO
           ========================================== */

        .toast-container {
            width: min(100%, 420px);
            max-width: 100%;
            padding: 0.75rem;
        }

        .toast-container .toast {
            width: 100%;
            max-width: 100%;
        }

        .toast-body {
            overflow-wrap: anywhere;
        }

        /* ==========================================
           PIED DE PAGE
           ========================================== */

        .site-footer {
            flex-shrink: 0;
            width: 100%;
            padding: 0 1rem;
            text-align: center;
        }

        /* ==========================================
           TABLETTES ET ÉCRANS INTERMÉDIAIRES
           ========================================== */

        @media (max-width: 991.98px) {
            .main-content {
                padding-top: 1rem;
                padding-bottom: 1rem;
            }

            .container {
                max-width: 100%;
            }

            .table-responsive table {
                white-space: nowrap;
            }

            .navbar .container-fluid {
                padding-left: 12px;
                padding-right: 12px;
            }

            .navbar .navbar-collapse {
                max-height: calc(100vh - 70px);
                overflow-y: auto;
                overscroll-behavior: contain;
            }

            .navbar .navbar-nav {
                padding-top: 0.35rem;
                padding-bottom: 0.35rem;
            }

            .navbar .nav-link {
                padding: 0.65rem 0.5rem;
            }

            .navbar .dropdown-menu {
                width: max-content;
                min-width: 220px;
                max-width: min(360px, 92vw);
                margin-top: 0.25rem;
            }

            .navbar .dropdown-menu .dropdown-item {
                white-space: normal;
                overflow-wrap: anywhere;
            }
        }

        /* ==========================================
           SMARTPHONES
           ========================================== */

        @media (max-width: 575.98px) {
            body {
                font-size: 14px;
            }

            .main-content.container,
            .main-content.container-fluid {
                padding-left: 12px;
                padding-right: 12px;
            }

            .main-content {
                margin-top: 0 !important;
            }

            h1,
            .h1 {
                font-size: 1.5rem;
            }

            h2,
            .h2 {
                font-size: 1.3rem;
            }

            h3,
            .h3 {
                font-size: 1.15rem;
            }

            .navbar .navbar-brand {
                font-size: 1rem;
            }

            .navbar .navbar-brand img {
                width: 30px;
                height: 30px;
            }

            .navbar .navbar-toggler {
                padding: 0.3rem 0.5rem;
            }

            .navbar .dropdown-menu {
                max-width: 92vw;
            }

            .btn {
                min-height: 38px;
            }

            .form-control,
            .form-select {
                min-height: 40px;
                font-size: 16px;
            }

            .table {
                font-size: 12px;
            }

            .card-body {
                padding: 0.85rem;
            }

            .toast-container {
                top: 0 !important;
                right: 0 !important;
                left: 0 !important;
                width: 100%;
                padding: 0.5rem;
            }

            .site-footer {
                margin-top: 1.5rem !important;
                margin-bottom: 0.75rem !important;
            }
        }

        /* ==========================================
           ACCESSIBILITÉ
           ========================================== */

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>
    {% include 'navbar.html' %}

    <!-- Contenu principal -->
    <main class="container main-content">

        <!-- Notifications Django -->
        <div
            class="toast-container position-fixed top-0 end-0 p-3"
            style="z-index: 1100;"
            aria-live="polite"
            aria-atomic="true"
        >
            {% if messages %}
                {% for message in messages %}
                    <div
                        class="toast align-items-center text-bg-{% if message.tags == 'error' %}danger{% elif message.tags == 'debug' %}secondary{% else %}{{ message.tags|default:'info' }}{% endif %} border-0 mb-2"
                        role="alert"
                        data-bs-delay="5000"
                    >
                        <div class="d-flex">
                            <div class="toast-body">
                                {{ message }}
                            </div>

                            <button
                                type="button"
                                class="btn-close btn-close-white me-2 m-auto"
                                data-bs-dismiss="toast"
                                aria-label="Fermer"
                            ></button>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        </div>

        {% block content %}{% endblock %}

    </main>

    <!-- Pied de page -->
    <footer class="site-footer mt-5 mb-3">
        <hr>
        <small>&copy; 2026 Transit ERP</small>
    </footer>

    <!-- JavaScript local Bootstrap -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/ap.js' %}"></script>

    <!-- Affichage automatique des notifications -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof bootstrap === 'undefined') {
                return;
            }

            document.querySelectorAll('.toast').forEach(function (toastEl) {
                bootstrap.Toast.getOrCreateInstance(toastEl).show();
            });
        });
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
