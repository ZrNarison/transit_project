{% extends 'base.html' %}

{% block title %}{{ action }} un dépôt{% endblock %}

{% block content %}
<div class="page-card">
    <h3 class="mb-3">{{ action }} un dépôt</h3>
    <p class="text-muted">Saisissez les informations du dépôt à enregistrer.</p>

    <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Nom</label>
                {{ form.nom }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Montant</label>
                {{ form.montant }}
            </div>
            <div class="col-12">
                <label class="form-label">Description</label>
                {{ form.description }}
            </div>
        </div>
        <button type="submit" class="btn btn-primary mt-4">Enregistrer</button>
    </form>
</div>
{% endblock %}
